version: 1
notes:
- Visual grouping (collapse/expand) only; no lineage edges here.
- Group IDs are prefixed with 'group.' to avoid collisions with field node IDs.
- PQD source grouping uses '_' in avroPath as hierarchy delimiter (rendered as dots
  in labels).
- Groups are created for prefixes with >= 5 leaf fields; single-member groups are
  eliminated.
groupSets:
